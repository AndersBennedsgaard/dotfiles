name: Update lazy.nvim plugins

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest

    env:
      XDG_CONFIG_HOME: ${{ github.workspace }}/dotfiles
      LAZY_DATA_DIR: ${{ github.workspace }}/.local/share/nvim/lazy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27

      - name: Update plugins
        run: |
          mkdir -p "$LAZY_DATA_DIR"
          cp $XDG_CONFIG_HOME/nvim/lazy-lock.json "${RUNNER_TEMP}/lazy-lock.old.json"

          nix develop --command bash -c '
            nvim --headless "+Lazy! update" +qa
          '

      - name: Generate changelog
        run: |
          nix develop --command python scripts/generate-lazy-changelog.py \
            --old-lock "${RUNNER_TEMP}/lazy-lock.old.json" \
            --new-lock dotfiles/nvim/lazy-lock.json \
            --out "${RUNNER_TEMP}/LAZY_CHANGELOG.md"

          echo "Lazy update markdown:"
          cat "${RUNNER_TEMP}/LAZY_CHANGELOG.md"

      - name: Run healthcheck
        run: |
          nix develop --command bash -c '
            set +e

            nvim --headless \
              "+redir! >${RUNNER_TEMP}/healthcheck.txt" \
              "+silent checkhealth" \
              "+redir END" \
              +qa

            status=$?

            echo "::group::Neovim healthcheck"
            cat "${RUNNER_TEMP}/healthcheck.txt"
            echo "::endgroup::"

            exit "$status"
          '

      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GH_TOKEN_FOR_FLAKE_UPDATES }}
          branch: build/lazy-update
          commit-message: "chore: update lazy.nvim plugins"
          title: "Update lazy.nvim plugins"
          labels: |
            dependencies
            automated
          body-path: "${{ runner.temp }}/LAZY_CHANGELOG.md"
